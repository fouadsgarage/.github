<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#080d18"/>
      <stop offset="1" stop-color="#101326"/>
    </linearGradient>
    <linearGradient id="glow">
      <stop stop-color="#00f5d4"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>

  <g fill="#00f5d4" font-family="monospace" font-size="25" opacity=".3">
    <text x="40" y="55">&lt;/&gt;</text>
    <text x="220" y="100">{ }</text>
    <text x="800" y="65">=&gt;</text>
    <text x="900" y="180">01</text>
    <text x="100" y="245">//</text>
    <text x="700" y="250">[ ]</text>
    <text x="450" y="45">const</text>
    <text x="570" y="270">0xFF</text>
  </g>

  <g fill="#9b5cff" font-family="monospace" font-size="22" opacity=".25">
    <text x="350" y="80">function()</text>
    <text x="850" y="110">&lt;div&gt;</text>
    <text x="170" y="180">return;</text>
    <text x="650" y="130">null</text>
    <text x="400" y="255">while(true)</text>
  </g>

  <g fill="none" stroke="#00f5d4" opacity=".25">
    <path d="M0 150 H1000"/>
    <path d="M0 151 H1000" stroke-width="4" filter="url(#blur)"/>
  </g>

  <text x="500" y="145" text-anchor="middle"
        font-family="monospace" font-size="34"
        font-weight="bold" fill="white">
    This seemed like a good idea
  </text>
  <text x="500" y="190" text-anchor="middle"
        font-family="monospace" font-size="34"
        font-weight="bold" fill="url(#glow)">
    at 3 AM.
  </text>

  <text x="500" y="235" text-anchor="middle"
        font-family="monospace" font-size="11"
        letter-spacing="7" fill="#718096">
    F O U A D S G A R A G E
  </text>
</svg>
