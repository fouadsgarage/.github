<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>fouadsgarage: This seemed like a good idea at 3 AM.</title>
  <desc>Dark developer banner with the FG monogram in a cyan to purple gradient and the text "This seemed like a good idea at 3 AM."</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0f1226"/>
    </linearGradient>

    <linearGradient id="glow">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>

    <linearGradient id="logoGrad" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="380" y2="300">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>

    <linearGradient id="vline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f5d4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blobC">
      <stop offset="0" stop-color="#00f5d4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobP">
      <stop offset="0" stop-color="#9b5cff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#05070d" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070d" stop-opacity=".6"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>

    <filter id="blurLogo" filterUnits="userSpaceOnUse" x="40" y="40" width="400" height="320">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blurText" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <g id="fg">
      <rect x="100" y="100" width="36" height="200" fill="url(#logoGrad)"/>
      <path d="M136 118 H298 A40 40 0 0 0 258 158 V242 A40 40 0 0 0 298 282 H322 A40 40 0 0 0 362 242 V200 H308"
            fill="none" stroke="url(#logoGrad)" stroke-width="36" stroke-linejoin="miter" stroke-linecap="butt"/>
      <path d="M136 200 H205" fill="none" stroke="url(#logoGrad)" stroke-width="36" stroke-linecap="butt"/>
    </g>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="165" cy="150" r="230" fill="url(#blobC)"/>
  <circle cx="860" cy="60" r="260" fill="url(#blobP)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="18" fill="url(#vig)"/>

  <g font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,Menlo,monospace">

    <g fill="#00f5d4" font-size="22" opacity=".22">
      <text x="30" y="64">&lt;/&gt;</text>
      <text x="235" y="268">{ }</text>
      <text x="905" y="76">=&gt;</text>
      <text x="935" y="216">01</text>
      <text x="100" y="272">//</text>
      <text x="850" y="270">[ ]</text>
      <text x="560" y="78">const</text>
    </g>
    <g fill="#9b5cff" font-size="20" opacity=".26">
      <text x="680" y="272">function()</text>
      <text x="905" y="168">&lt;div&gt;</text>
      <text x="745" y="222">null</text>
    </g>

    <circle cx="858" cy="32" r="3" fill="#00f5d4">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="940" y="36" font-size="12" fill="#64748b" text-anchor="end">03:07 AM</text>

    <g transform="translate(60 75) scale(.75) translate(-100 -100)">
      <use href="#fg" filter="url(#blurLogo)" opacity=".6">
        <animate attributeName="opacity" values=".45;.85;.45" dur="4s" repeatCount="indefinite"/>
      </use>
      <use href="#fg"/>
    </g>

    <rect x="300" y="75" width="1.5" height="150" fill="url(#vline)"/>

    <text x="320" y="148" font-size="34" font-weight="bold" fill="#f8fafc" textLength="572">This seemed like a good idea</text>

    <text x="320" y="196" font-size="34" font-weight="bold" fill="#00f5d4" opacity=".55" filter="url(#blurText)" textLength="164">at 3 AM.</text>
    <text x="320" y="196" font-size="34" font-weight="bold" fill="url(#glow)" textLength="164">at 3 AM.</text>
    <rect x="494" y="170" width="16" height="30" fill="#9b5cff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="320" y="252" font-size="12" letter-spacing="7" fill="#718096">FOUADSGARAGE</text>
  </g>

  <rect x=".75" y=".75" width="998.5" height="298.5" rx="17.5" fill="none" stroke="url(#glow)" stroke-opacity=".35" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
